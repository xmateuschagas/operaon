# Banco privado; API, web e worker usam a rede interna pelo nome postgres.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operaon
      POSTGRES_USER: operaon_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env local}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U operaon_migrator -d operaon']
      interval: 5s
      retries: 10
  api:
    image: node:22-alpine
    working_dir: /app
    volumes: [.:/app, dependencies:/app/node_modules]
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm db:migrate && pnpm --filter @operaon/api dev"
    env_file: .env
    environment:
      HOST: 0.0.0.0
    depends_on:
      postgres: { condition: service_healthy }
    ports: ['127.0.0.1:3000:3000']
    networks: [internal, public]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      start_period: 180s
      retries: 10
  worker:
    image: node:22-alpine
    working_dir: /app
    volumes: [.:/app, dependencies:/app/node_modules]
    command: sh -c "corepack enable && pnpm --filter @operaon/worker dev"
    env_file: .env
    depends_on:
      api: { condition: service_healthy }
    networks: [internal, public]
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: [.:/app, dependencies:/app/node_modules]
    command: sh -c "corepack enable && pnpm --filter @operaon/web exec vite --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:3000
    ports: ['127.0.0.1:5173:5173']
    depends_on:
      api: { condition: service_healthy }
    networks: [public]
volumes:
  postgres-data:
  dependencies:
networks:
  internal: { internal: true }
  public:

; A conexão preserva o usuário do cliente; cada login tem seu próprio pool e privilégios.
[databases]
operaon = host=postgres port=5432 dbname=operaon
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
auth_type = scram-sha-256
auth_file = /run/secrets/pgbouncer_users
pool_mode = transaction
default_pool_size = 10
max_client_conn = 200
max_db_connections = 30
max_prepared_statements = 0
server_reset_query = DISCARD ALL
server_reset_query_always = 1
log_connections = 0
log_disconnections = 0
stats_period = 60

# Proxy interno mantém a API sem porta publicada e remove /api antes de encaminhar.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 log_format structured escape=json '{"service":"web","tenant_id":null,"user_id":null,"method":"$request_method","uri":"$uri","status":$status}';
 access_log /dev/stdout structured;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /health { access_log off; return 200 'ok'; }
  location = /ready { proxy_pass http://api:3000/ready; }
  location /api/ {
   proxy_pass http://api:3000/;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_read_timeout 30s;
   # Não registrar query strings OAuth ou links que possam conter token.
   access_log off;
  }
  location / { try_files $uri $uri/ /index.html; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 }
}

name: Build e entrega preparada
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        description: Ambiente protegido para entrega pelo Mateus
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Desabilitado por padrão. O handoff não habilita esta variável nem executa este workflow.
  images:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    strategy:
      matrix: {service: [api, worker, web, pgbouncer]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service == 'pgbouncer' && 'deploy/pgbouncer/Dockerfile' || format('apps/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: ghcr.io/xmateuschagas/operaon-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
  deploy:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Executar entrega previamente habilitada pelo Mateus
        env:
          DEPLOY_ENABLED: 'true'
          DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash deploy/remote-release.sh
